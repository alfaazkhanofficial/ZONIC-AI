<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>ZONIC M4</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<style>
  :root{color-scheme:dark;--bg:#080A0D;--text:#F1F4F8;--muted:#A6B0BE;--teal:#258BFF;--danger:#FF6868;--border:#2a3441}
  body{margin:0;height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#0f1b2e,#080A0D 62%);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif}
  main{text-align:center;max-width:520px;padding:24px}
  h1{letter-spacing:.32em;font-weight:600;margin:0 0 8px}
  p{color:var(--muted);line-height:1.5}
  .ring{width:56px;height:56px;margin:0 auto 22px;border:2px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin 1.1s linear infinite}
  @media (prefers-reduced-motion:reduce){.ring{animation:none;border-top-color:var(--border);border-right-color:var(--teal)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err .ring{display:none} .err h2{color:var(--danger)}
  pre{text-align:left;background:#0A1718;border:1px solid var(--border);border-radius:10px;padding:10px;max-height:160px;overflow:auto;font-size:12px;color:var(--muted)}
  button{background:var(--teal);color:#04101f;border:0;border-radius:11px;padding:10px 18px;font-weight:600;cursor:pointer;margin:6px}
  button.secondary{background:transparent;color:var(--text);border:1px solid var(--border)}
  button:focus-visible{outline:2px solid #63F4E2;outline-offset:2px}
</style></head>
<body><main id="m" role="status" aria-live="polite">
  <div class="ring"></div><h1>ZONIC M4</h1><h2 id="t" style="font-weight:500">Starting the local backend…</h2><p id="d">Waiting for the Python service to report healthy.</p>
  <pre id="log" hidden></pre><div id="actions" hidden>
    <button id="retry">Retry</button><button id="logs" class="secondary">Open logs folder</button></div>
</main>
<script>
  const z = window.zonic, $ = (i) => document.getElementById(i);
  function render(s){
    $('t').textContent = s.state === 'failed' ? 'The backend could not start' : s.state === 'restarting' ? 'Backend stopped — restarting…' : 'Starting the local backend…';
    $('d').textContent = s.detail || '';
    const failed = s.state === 'failed';
    document.getElementById('m').className = failed ? 'err' : '';
    $('actions').hidden = !failed;
    $('log').hidden = !(failed && s.tail && s.tail.length); $('log').textContent = (s.tail || []).join('\n');
  }
  if (z) { z.onBackendState(render); z.getBackendState().then(render); $('retry').onclick = () => z.retryBackend(); $('logs').onclick = () => z.openLogs(); }
</script></body></html>
